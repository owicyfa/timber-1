name: CCTP Message Validation Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cctp-message-handling:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install OpenZeppelin dependency
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit

      - name: Build contracts
        run: |
          forge build

      - name: Deploy test contract on Sepolia
        id: deploy
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -euo pipefail
          
          echo "Attempting deployment..."
          
          # Add 0x prefix if not present
          FORMATTED_KEY="$PRIVATE_KEY"
          if [[ ! "$FORMATTED_KEY" =~ ^0x ]]; then
            FORMATTED_KEY="0x$FORMATTED_KEY"
          fi
          
          OUTPUT=$(forge create \
            --rpc-url "$RPC_URL" \
            --private-key "$FORMATTED_KEY" \
            src/CCTPMessageTest.sol:CCTPMessageTest \
            --json 2>&1) || {
              echo "Deployment failed. Output:"
              echo "$OUTPUT"
              exit 1
            }
          
          echo "$OUTPUT"
          
          CONTRACT_ADDRESS=$(echo "$OUTPUT" | jq -r '.deployedTo // .address // empty')
          
          if [ -z "$CONTRACT_ADDRESS" ]; then
            echo "Failed to extract contract address from output"
            exit 1
          fi
          
          echo "contract_address=$CONTRACT_ADDRESS" >> "$GITHUB_OUTPUT"
          echo "✓ Deployed contract at: $CONTRACT_ADDRESS"

      - name: Send finalized direct message
        id: direct_message
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ steps.deploy.outputs.contract_address }}
        run: |
          set -euo pipefail

          FORMATTED_KEY="$PRIVATE_KEY"
          if [[ ! "$FORMATTED_KEY" =~ ^0x ]]; then
            FORMATTED_KEY="0x$FORMATTED_KEY"
          fi

          OUTPUT=$(cast send \
            --rpc-url "$RPC_URL" \
            --private-key "$FORMATTED_KEY" \
            "$CONTRACT_ADDRESS" \
            "sendDirectMessage(uint32,bytes32,uint256)" \
            0 \
            0x000000000000000000000000f301230894f5ace64e89224f56f0531f73094f9b \
            1000000 \
            --json 2>&1) || {
              echo "Direct message send failed:"
              echo "$OUTPUT"
              exit 1
            }

          TX_HASH=$(echo "$OUTPUT" | jq -r '.transactionHash // .hash // empty')
          
          echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"
          echo "✓ Direct-message transaction: $TX_HASH"

      - name: Send fake deposit message
        id: fake_deposit
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ steps.deploy.outputs.contract_address }}
        run: |
          set -euo pipefail

          FORMATTED_KEY="$PRIVATE_KEY"
          if [[ ! "$FORMATTED_KEY" =~ ^0x ]]; then
            FORMATTED_KEY="0x$FORMATTED_KEY"
          fi

          OUTPUT=$(cast send \
            --rpc-url "$RPC_URL" \
            --private-key "$FORMATTED_KEY" \
            "$CONTRACT_ADDRESS" \
            "sendFakeUSDCDeposit(uint32,bytes32,uint256)" \
            0 \
            0x000000000000000000000000f301230894f5ace64e89224f56f0531f73094f9b \
            5000000000 \
            --json 2>&1) || {
              echo "Fake deposit send failed:"
              echo "$OUTPUT"
              exit 1
            }

          TX_HASH=$(echo "$OUTPUT" | jq -r '.transactionHash // .hash // empty')

          echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"
          echo "✓ Fake-deposit transaction: $TX_HASH"

      - name: Wait for transaction receipts
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DIRECT_TX_HASH: ${{ steps.direct_message.outputs.tx_hash }}
          FAKE_TX_HASH: ${{ steps.fake_deposit.outputs.tx_hash }}
        run: |
          set -euo pipefail

          echo "Waiting for direct message receipt..."
          cast receipt \
            --rpc-url "$RPC_URL" \
            "$DIRECT_TX_HASH" \
            --confirmations 1

          echo "Waiting for fake deposit receipt..."
          cast receipt \
            --rpc-url "$RPC_URL" \
            "$FAKE_TX_HASH" \
            --confirmations 1

      - name: Query Iris for direct-message response
        id: direct_attestation
        env:
          TX_HASH: ${{ steps.direct_message.outputs.tx_hash }}
        run: |
          set -euo pipefail

          echo "Waiting 60 seconds for Iris to process..."
          sleep 60

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --get \
            --url "https://iris-api-sandbox.circle.com/v2/messages/0" \
            --data-urlencode "transactionHash=$TX_HASH" \
            --header "accept: application/json" 2>&1) || {
              echo "Iris API call failed:"
              echo "$RESPONSE"
              exit 0
            }

          printf '%s\n' "$RESPONSE" > direct-attestation.json

          {
            echo "response<<EOF"
            cat direct-attestation.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "✓ Direct-message Iris response:"
          jq . direct-attestation.json

      - name: Query Iris for fake-deposit response
        id: fake_attestation
        env:
          TX_HASH: ${{ steps.fake_deposit.outputs.tx_hash }}
        run: |
          set -euo pipefail

          echo "Waiting 60 seconds for Iris to process..."
          sleep 60

          RESPONSE=$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --get \
            --url "https://iris-api-sandbox.circle.com/v2/messages/0" \
            --data-urlencode "transactionHash=$TX_HASH" \
            --header "accept: application/json" 2>&1) || {
              echo "Iris API call failed:"
              echo "$RESPONSE"
              exit 0
            }

          printf '%s\n' "$RESPONSE" > fake-attestation.json

          {
            echo "response<<EOF"
            cat fake-attestation.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "✓ Fake-deposit Iris response:"
          jq . fake-attestation.json

      - name: Generate research report
        if: always()
        env:
          DIRECT_TX_HASH: ${{ steps.direct_message.outputs.tx_hash }}
          FAKE_TX_HASH: ${{ steps.fake_deposit.outputs.tx_hash }}
          DIRECT_RESPONSE: ${{ steps.direct_attestation.outputs.response }}
          FAKE_RESPONSE: ${{ steps.fake_attestation.outputs.response }}
        run: |
          {
            echo "# CCTP Message Validation Research Results"
            echo
            echo "> Sepolia-only research. This test evaluates Iris attestation behavior."
            echo
            echo "## Test Execution"
            echo
            echo "**Direct Message Transaction**: ${DIRECT_TX_HASH:- NOT EXECUTED}"
            echo
            echo "**Fake Deposit Transaction**: ${FAKE_TX_HASH:- NOT EXECUTED}"
            echo
            echo "## Iris Attestation Responses"
            echo
            echo "### Direct Message"
            echo '```json'
            if [ -n "${DIRECT_RESPONSE}" ]; then
              printf '%s\n' "${DIRECT_RESPONSE}" | jq . 2>/dev/null || printf '%s\n' "${DIRECT_RESPONSE}"
            else
              echo "No response captured"
            fi
            echo '```'
            echo
            echo "### Fake Deposit Message"
            echo '```json'
            if [ -n "${FAKE_RESPONSE}" ]; then
              printf '%s\n' "${FAKE_RESPONSE}" | jq . 2>/dev/null || printf '%s\n' "${FAKE_RESPONSE}"
            else
              echo "No response captured"
            fi
            echo '```'
            echo
            echo "## Analysis"
            echo "The test checks whether Iris returns attestations for messages submitted directly through MessageTransmitterV2."
          } > results.md

          cat results.md

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctp-research-results
          path: |
            results.md
            direct-attestation.json
            fake-attestation.json
          if-no-files-found: warn
