name: CCTP Message Validation Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cctp-message-handling:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install OpenZeppelin dependency
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit

      - name: Build contracts
        run: |
          forge build

      - name: Deploy test contract on Sepolia
        id: deploy
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -euo pipefail

          OUTPUT="$(
            forge create \
              --rpc-url "$RPC_URL" \
              --private-key "$PRIVATE_KEY" \
              src/CCTPMessageTest.sol:CCTPMessageTest \
              --json
          )"

          CONTRACT_ADDRESS="$(echo "$OUTPUT" | jq -er '.deployedTo')"

          echo "contract_address=$CONTRACT_ADDRESS" >> "$GITHUB_OUTPUT"
          echo "Deployed contract: $CONTRACT_ADDRESS"

      - name: Send finalized direct message
        id: direct_message
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ steps.deploy.outputs.contract_address }}
        run: |
          set -euo pipefail

          OUTPUT="$(
            cast send \
              --rpc-url "$RPC_URL" \
              --private-key "$PRIVATE_KEY" \
              "$CONTRACT_ADDRESS" \
              "sendDirectMessage(uint32,bytes32,uint256)" \
              0 \
              0x000000000000000000000000f301230894f5ace64e89224f56f0531f73094f9b \
              1000000 \
              --json
          )"

          TX_HASH="$(echo "$OUTPUT" | jq -er '.transactionHash // .hash')"

          echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"
          echo "Direct-message transaction: $TX_HASH"

      - name: Send fake deposit message
        id: fake_deposit
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ steps.deploy.outputs.contract_address }}
        run: |
          set -euo pipefail

          OUTPUT="$(
            cast send \
              --rpc-url "$RPC_URL" \
              --private-key "$PRIVATE_KEY" \
              "$CONTRACT_ADDRESS" \
              "sendFakeUSDCDeposit(uint32,bytes32,uint256)" \
              0 \
              0x000000000000000000000000f301230894f5ace64e89224f56f0531f73094f9b \
              5000000000 \
              --json
          )"

          TX_HASH="$(echo "$OUTPUT" | jq -er '.transactionHash // .hash')"

          echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"
          echo "Fake-deposit transaction: $TX_HASH"

      - name: Wait for transaction receipts
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DIRECT_TX_HASH: ${{ steps.direct_message.outputs.tx_hash }}
          FAKE_TX_HASH: ${{ steps.fake_deposit.outputs.tx_hash }}
        run: |
          set -euo pipefail

          cast receipt \
            --rpc-url "$RPC_URL" \
            "$DIRECT_TX_HASH" \
            --confirmations 2

          cast receipt \
            --rpc-url "$RPC_URL" \
            "$FAKE_TX_HASH" \
            --confirmations 2

      - name: Query Iris for direct-message response
        id: direct_attestation
        env:
          TX_HASH: ${{ steps.direct_message.outputs.tx_hash }}
        run: |
          set -euo pipefail

          sleep 60

          RESPONSE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --get \
              --url "https://iris-api-sandbox.circle.com/v2/messages/0" \
              --data-urlencode "transactionHash=$TX_HASH" \
              --header "accept: application/json"
          )"

          printf '%s\n' "$RESPONSE" > direct-attestation.json

          {
            echo "response<<EOF"
            cat direct-attestation.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Direct-message Iris response:"
          jq . direct-attestation.json

      - name: Query Iris for fake-deposit response
        id: fake_attestation
        env:
          TX_HASH: ${{ steps.fake_deposit.outputs.tx_hash }}
        run: |
          set -euo pipefail

          sleep 60

          RESPONSE="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --get \
              --url "https://iris-api-sandbox.circle.com/v2/messages/0" \
              --data-urlencode "transactionHash=$TX_HASH" \
              --header "accept: application/json"
          )"

          printf '%s\n' "$RESPONSE" > fake-attestation.json

          {
            echo "response<<EOF"
            cat fake-attestation.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Fake-deposit Iris response:"
          jq . fake-attestation.json

      - name: Generate research report
        if: always()
        env:
          DIRECT_TX_HASH: ${{ steps.direct_message.outputs.tx_hash }}
          FAKE_TX_HASH: ${{ steps.fake_deposit.outputs.tx_hash }}
          DIRECT_RESPONSE: ${{ steps.direct_attestation.outputs.response }}
          FAKE_RESPONSE: ${{ steps.fake_attestation.outputs.response }}
        run: |
          {
            echo "# CCTP Message Validation Research Results"
            echo
            echo "> Sepolia-only research. This test evaluates Iris attestation behavior and does not execute a destination-chain receive flow."
            echo
            echo "## Direct Message"
            echo "- Transaction: ${DIRECT_TX_HASH:- unavailable}"
            echo
            echo '```json'
            printf '%s\n' "${DIRECT_RESPONSE:-No response captured}" | jq . 2>/dev/null || printf '%s\n' "${DIRECT_RESPONSE:-No response captured}"
            echo '```'
            echo
            echo "## Fake Deposit Message"
            echo "- Transaction: ${FAKE_TX_HASH:- unavailable}"
            echo
            echo '```json'
            printf '%s\n' "${FAKE_RESPONSE:-No response captured}" | jq . 2>/dev/null || printf '%s\n' "${FAKE_RESPONSE:-No response captured}"
            echo '```'
            echo
            echo "## Scope"
            echo
            echo "The test checks whether Iris returns an attestation response for messages submitted directly through MessageTransmitterV2."
          } > results.md

          cat results.md

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctp-research-results
          path: |
            results.md
            direct-attestation.json
            fake-attestation.json
          if-no-files-found: warn
