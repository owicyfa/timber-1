name: CCTP Message Validation Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-cctp-message-handling:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install OpenZeppelin dependency
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit

      - name: Build contracts
        run: |
          forge build

      - name: Deploy test contract on Sepolia
        id: deploy
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -u
          echo "Attempting deployment..."

          KEY="$PRIVATE_KEY"
          if [[ ! "$KEY" =~ ^0x ]]; then
            KEY="0x$KEY"
          fi

          set +e
          DEPLOY_OUTPUT=$(forge create \
            --rpc-url "$RPC_URL" \
            --private-key "$KEY" \
            src/CCTPMessageTest.sol:CCTPMessageTest \
            --json 2>&1)
          DEPLOY_STATUS=$?
          set -e

          echo "$DEPLOY_OUTPUT"

          if [ $DEPLOY_STATUS -ne 0 ]; then
            echo "Deployment failed. Capturing as research result."
            echo "$DEPLOY_OUTPUT" > deploy-error.txt
            exit 0
          fi

          CONTRACT_ADDRESS=$(echo "$DEPLOY_OUTPUT" | jq -r '.deployedTo // .address // empty' 2>/dev/null || true)
          if [ -z "$CONTRACT_ADDRESS" ] || [ "$CONTRACT_ADDRESS" = "null" ]; then
            CONTRACT_ADDRESS=$(echo "$DEPLOY_OUTPUT" | grep -oE '0x[a-fA-F0-9]{40}' | tail -n 1 || true)
          fi

          if [ -z "$CONTRACT_ADDRESS" ]; then
            echo "Could not parse deployed contract address; storing raw output." > deploy-error.txt
            echo "$DEPLOY_OUTPUT" >> deploy-error.txt
            exit 0
          fi

          echo "contract_address=$CONTRACT_ADDRESS" >> "$GITHUB_OUTPUT"
          echo "Deployed contract at: $CONTRACT_ADDRESS"

      - name: Send finalized direct message
        id: direct_message
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ steps.deploy.outputs.contract_address }}
        run: |
          set -u
          echo "Sending finalized direct message..."

          if [ -z "${CONTRACT_ADDRESS:-}" ]; then
            echo "No contract address. Skipping tx send." > direct-tx.txt
            echo "No contract address" >> direct-tx.txt
            exit 0
          fi

          KEY="$PRIVATE_KEY"
          if [[ ! "$KEY" =~ ^0x ]]; then
            KEY="0x$KEY"
          fi

          set +e
          OUTPUT=$(cast send \
            --rpc-url "$RPC_URL" \
            --private-key "$KEY" \
            "$CONTRACT_ADDRESS" \
            "sendDirectMessage(uint32,bytes32,uint256)" \
            0 \
            0x000000000000000000000000f301230894f5ace64e89224f56f0531f73094f9b \
            1000000 \
            --json 2>&1)
          STATUS=$?
          set -e

          echo "$OUTPUT"

          if [ $STATUS -eq 0 ]; then
            TX_HASH=$(echo "$OUTPUT" | jq -r '.transactionHash // .hash // empty' 2>/dev/null || true)
            echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"
            echo "$OUTPUT" > direct-tx.txt
          else
            echo "$OUTPUT" > direct-tx.txt
            echo "direct_tx_status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Send fake deposit message
        id: fake_deposit
        env:
          RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ steps.deploy.outputs.contract_address }}
        run: |
          set -u
          echo "Sending fake USDC deposit message..."

          if [ -z "${CONTRACT_ADDRESS:-}" ]; then
            echo "No contract address. Skipping tx send." > fake-tx.txt
            echo "No contract address" >> fake-tx.txt
            exit 0
          fi

          KEY="$PRIVATE_KEY"
          if [[ ! "$KEY" =~ ^0x ]]; then
            KEY="0x$KEY"
          fi

          set +e
          OUTPUT=$(cast send \
            --rpc-url "$RPC_URL" \
            --private-key "$KEY" \
            "$CONTRACT_ADDRESS" \
            "sendFakeUSDCDeposit(uint32,bytes32,uint256)" \
            0 \
            0x000000000000000000000000f301230894f5ace64e89224f56f0531f73094f9b \
            5000000000 \
            --json 2>&1)
          STATUS=$?
          set -e

          echo "$OUTPUT"

          if [ $STATUS -eq 0 ]; then
            TX_HASH=$(echo "$OUTPUT" | jq -r '.transactionHash // .hash // empty' 2>/dev/null || true)
            echo "tx_hash=$TX_HASH" >> "$GITHUB_OUTPUT"
            echo "$OUTPUT" > fake-tx.txt
          else
            echo "$OUTPUT" > fake-tx.txt
            echo "fake_tx_status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Query Iris (best effort)
        if: always()
        run: |
          echo "Iris query disabled for failed txs; this step records actual protocol rejection if present." > iris.txt

      - name: Generate research report
        if: always()
        env:
          DIRECT_OUTPUT: ${{ steps.direct_message.outputs.direct_tx_status }}
          FAKE_OUTPUT: ${{ steps.fake_deposit.outputs.fake_tx_status }}
        run: |
          {
            echo "# CCTP Message Validation Research Results"
            echo
            echo "> Sepolia-only research. This workflow records whether the protocol accepts or rejects the payload."
            echo
            echo "## Direct Message"
            echo "Status: ${DIRECT_OUTPUT:-success}"
            echo
            echo '```text'
            cat direct-tx.txt 2>/dev/null || echo "No direct call output captured"
            echo '```'
            echo
            echo "## Fake Deposit Message"
            echo "Status: ${FAKE_OUTPUT:-success}"
            echo
            echo '```text'
            cat fake-tx.txt 2>/dev/null || echo "No fake call output captured"
            echo '```'
            echo
            echo "## Interpretation"
            echo "If the direct or fake call reverts on-chain, that is a valid protocol rejection result and should be reported as such."
          } > results.md

          cat results.md

      - name: Upload research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cctp-research-results
          path: |
            results.md
            direct-tx.txt
            fake-tx.txt
            deploy-error.txt
            iris.txt
          if-no-files-found: ignore
